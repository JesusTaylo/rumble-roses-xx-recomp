# Overrides manuales del codegen para Rumble Roses XX.
# Cada entrada documenta como se descubrio, para que los patrones se puedan repetir.

# CRT setjmp/longjmp (identificados por patron en .text, etapa 1).
# setjmp: guarda f14-f31 (stfd 0..136(r3)) y r13-r31 (std 152..296(r3)), r1 en 144, CR/LR en 304/308.
#   Empieza con el stub de hook (lwz r0,-24708(r4) -> 0x82A99F7C; si no es nulo salta por ctr).
# longjmp: mismo layout inverso (lfd/ld desde r7 = jmp_buf), r3 = valor de retorno.
setjmp_address = 0x824726C0
longjmp_address = 0x82472470

# Destinos de saltos 'b' (tail calls) que el analisis no detecto como inicio de funcion
# (UnresolvedCall: "target not in any function"), etapa 0.
[functions]
0x823649B0 = {}   # desde 0x8219575C
0x82364958 = {}   # desde 0x82195774
0x82344F90 = {}   # desde 0x82347424

